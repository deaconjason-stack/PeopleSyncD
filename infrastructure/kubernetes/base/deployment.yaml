apiVersion: apps/v1
kind: Deployment
metadata:
  name: peoplesyncd-api
  namespace: peoplesyncd
  annotations:
    peoplesyncd.io/status: template-only-not-certified
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: peoplesyncd-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peoplesyncd-api
        app.kubernetes.io/part-of: peoplesyncd
    spec:
      serviceAccountName: peoplesyncd-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/deaconjason-stack/peoplesyncd-api:0.1.0-foundation
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: peoplesyncd-api-config
          env:
            - name: PEOPLESYNCD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: peoplesyncd-runtime-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
