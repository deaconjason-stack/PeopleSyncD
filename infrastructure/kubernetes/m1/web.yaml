apiVersion: apps/v1
kind: Deployment
metadata:
  name: peoplesyncd-web
  namespace: peoplesyncd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: peoplesyncd-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peoplesyncd-web
    spec:
      containers:
        - name: web
          image: ghcr.io/deaconjason-stack/peoplesyncd-web:replace-with-digest
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: peoplesyncd-web
  namespace: peoplesyncd
spec:
  selector:
    app.kubernetes.io/name: peoplesyncd-web
  ports:
    - name: http
      port: 80
      targetPort: http
