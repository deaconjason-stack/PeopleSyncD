apiVersion: apps/v1
kind: Deployment
metadata:
  name: peoplesyncd-api
  namespace: peoplesyncd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: peoplesyncd-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peoplesyncd-api
    spec:
      containers:
        - name: api
          image: ghcr.io/deaconjason-stack/peoplesyncd-api:replace-with-digest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /alive
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: peoplesyncd-api
  namespace: peoplesyncd
spec:
  selector:
    app.kubernetes.io/name: peoplesyncd-api
  ports:
    - name: http
      port: 80
      targetPort: http
