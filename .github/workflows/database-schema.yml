name: Database Schema Validation

on:
  pull_request:
    paths:
      - 'src/PeopleSyncD.Domain/**'
      - 'src/PeopleSyncD.Infrastructure/**'
      - '.github/workflows/database-schema.yml'
  push:
    branches: [main]

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify initial schema is present
        run: test -s src/PeopleSyncD.Infrastructure/Persistence/Migrations/0001_InitialSchema.sql
      - name: Verify required tables
        shell: bash
        run: |
          set -euo pipefail
          for table in organizations users organization_memberships people; do
            grep -q "CREATE TABLE IF NOT EXISTS peoplesyncd.${table}" src/PeopleSyncD.Infrastructure/Persistence/Migrations/0001_InitialSchema.sql
          done
      - name: Verify tenant uniqueness invariant
        run: grep -q 'UNIQUE(organization_id, email)' src/PeopleSyncD.Infrastructure/Persistence/Migrations/0001_InitialSchema.sql
