name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        run: python scripts/certification/generate_sbom.py --version "${{ steps.version.outputs.value }}" --commit "$GITHUB_SHA" --output release-work/SBOM.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: peoplesyncd-sbom-${{ steps.version.outputs.value }}
          path: release-work/SBOM.cdx.json
          if-no-files-found: error
