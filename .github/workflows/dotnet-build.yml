name: .NET Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Discover solution
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 5 \( -name '*.sln' -o -name '*.slnx' \) -print
      - name: Restore
        shell: bash
        run: dotnet restore
      - name: Build
        shell: bash
        run: dotnet build --no-restore --configuration Release
      - name: Test
        shell: bash
        run: dotnet test --no-build --configuration Release --verbosity normal
