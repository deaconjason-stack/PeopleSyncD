name: Bootstrap M2 Web Lockfile

on:
  push:
    branches:
      - sprint/m2.1-identity-tenant-slice
    paths:
      - src/PeopleSyncD.Web/package.json
      - .github/workflows/bootstrap-m2-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PeopleSyncD.Web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/m2.1-identity-tenant-slice
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit lockfile when changed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "PeopleSyncD Engineering Bot"
          git config user.email "engineering-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit deterministic M2 web lockfile"
          git push origin HEAD:sprint/m2.1-identity-tenant-slice
