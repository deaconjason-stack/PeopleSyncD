name: Enterprise Master Blueprint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-master-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative blueprint and indexes
        run: python scripts/governance/validate_master_blueprint.py
      - name: Validate JSON syntax
        run: python -m json.tool master-blueprint.json > /dev/null
      - name: Verify implementation plan exists
        run: test -s 02-Product/MASTER-IMPLEMENTATION-PLAN.md
