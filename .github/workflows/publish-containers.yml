name: Publish GHCR Containers

on:
  push:
    branches:
      - deployment/persistent-ghcr
    paths:
      - 'Dockerfile.Api'
      - 'src/PeopleSyncD.**'
      - '.github/workflows/publish-containers.yml'
      - 'deploy/production/**'
      - 'docker-compose.production.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/peoplesyncd-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/peoplesyncd-web

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.Api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:edge
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=peoplesyncd-api
          cache-to: type=gha,mode=max,scope=peoplesyncd-api
          provenance: mode=max
          sbom: true

      - name: Attest API image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: src/PeopleSyncD.Web
          file: src/PeopleSyncD.Web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:edge
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=peoplesyncd-web
          cache-to: type=gha,mode=max,scope=peoplesyncd-web
          provenance: mode=max
          sbom: true

      - name: Attest web image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Write deployment evidence
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p /tmp/peoplesyncd-publish
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg apiImage "$API_IMAGE" \
            --arg apiDigest "$API_DIGEST" \
            --arg webImage "$WEB_IMAGE" \
            --arg webDigest "$WEB_DIGEST" \
            '{commit:$commit,api:{image:$apiImage,digest:$apiDigest},web:{image:$webImage,digest:$webDigest}}' \
            > /tmp/peoplesyncd-publish/images.json
          cat /tmp/peoplesyncd-publish/images.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: peoplesyncd-ghcr-${{ github.sha }}
          path: /tmp/peoplesyncd-publish/images.json
          retention-days: 90
