name: Feature request
description: Propose an implementation-backed PeopleSyncD capability.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Business or user problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Measurable outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include security, tenant, accessibility, documentation, and test expectations.
    validations:
      required: true
