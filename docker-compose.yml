services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peoplesyncd
      POSTGRES_USER: peoplesyncd
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - peoplesyncd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplesyncd -d peoplesyncd"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - peoplesyncd-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__peoplesyncd: Host=postgres;Port=5432;Database=peoplesyncd;Username=peoplesyncd;Password=local-development-only
      OTEL_SERVICE_NAME: peoplesyncd-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: src/PeopleSyncD.Web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  peoplesyncd-postgres:
  peoplesyncd-redis:
