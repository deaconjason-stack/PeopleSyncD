asyncapi: 2.6.0
info: { title: PeopleSyncD Document Events, version: 0.1.0 }
channels:
  document.version_created.v1:
    publish:
      operationId: publishDocumentVersionCreated
      message:
        payload:
          type: object
          required: [eventId, eventType, schemaVersion, occurredAt, organizationId, correlationId, data]
          properties:
            eventId: { type: string, format: uuid }
            eventType: { const: document.version_created.v1 }
            schemaVersion: { const: '1.0' }
            occurredAt: { type: string, format: date-time }
            organizationId: { type: string, format: uuid }
            correlationId: { type: string }
            data:
              type: object
              required: [documentId, versionId, classification]
              properties:
                documentId: { type: string, format: uuid }
                versionId: { type: string, format: uuid }
                classification: { type: string }
