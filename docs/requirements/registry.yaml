registry:
  id: PSD-REQ-000001
  version: 1.1.0
  status: Approved

requirements:
  - id: PSD-REQ-PLATFORM-000001
    title: Multi-Tenant Architecture
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: Enterprise Architecture Office
    business_value: Prevent customer data exposure and support multiple deployment models.
    specification:
      - PSD-PEP-130
    acceptance_criteria:
      - Every tenant-owned record contains an immutable organization identifier.
      - Cross-tenant API, database, file, search, event, cache, export, and AI access is denied.
      - Automated tenant-isolation tests pass for every release candidate.
    security_impact: Critical
    compliance_impact: Foundational
    implementation_status: Planned

  - id: PSD-REQ-SEC-000001
    title: Immutable Audit Logging
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: Security Office
    business_value: Preserve trustworthy evidence for operations, investigations, customers, and certification.
    specification:
      - PSD-PEP-120
    api:
      - docs/api/audit.yaml
    events:
      - docs/asyncapi/audit-events.yaml
    acceptance_criteria:
      - Ordinary APIs cannot update or delete audit events.
      - Successful, denied, failed, canceled, and approval-pending actions can be recorded.
      - Integrity controls and authorized retrieval are verified.
    security_impact: Critical
    compliance_impact: Foundational
    implementation_status: Planned

  - id: PSD-REQ-IDENTITY-000001
    title: Strong Authentication and Session Control
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: Identity Domain
    business_value: Protect enterprise access while supporting modern authentication and federation.
    specification:
      - PSD-PEP-140
    acceptance_criteria:
      - Privileged roles require multi-factor authentication.
      - Sessions are revocable and refresh credentials rotate.
      - Sensitive actions require recent authentication.
      - Account disablement revokes active sessions.
    security_impact: Critical
    compliance_impact: Foundational
    implementation_status: Planned

  - id: PSD-REQ-ORG-000001
    title: Explicit Organization Context
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: Organization Domain
    business_value: Ensure every request executes within a verified customer boundary.
    specification:
      - PSD-PEP-130
      - PSD-PEP-140
    api:
      - docs/api/organization.yaml
    acceptance_criteria:
      - A user can enter only organizations with active membership.
      - Organization switching creates a new explicit context and audit event.
      - Client-supplied organization identifiers are validated server-side.
    security_impact: Critical
    compliance_impact: Foundational
    implementation_status: Planned

  - id: PSD-REQ-AI-000001
    title: Human Approval for High-Impact AI Actions
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: AI Platform Office
    business_value: Enable useful automation without surrendering accountable human authority.
    specification:
      - PSD-PEP-150
    api:
      - docs/api/ai.yaml
    acceptance_criteria:
      - Domonique 2.0 cannot execute defined high-impact actions without authorized approval.
      - Approval identity, scope, time, and outcome are audited.
      - Stale, expired, canceled, or unauthorized approvals cannot execute.
    security_impact: Critical
    compliance_impact: High
    implementation_status: Planned

  - id: PSD-REQ-AI-000002
    title: Permission-Aware AI Tool Invocation
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: AI Platform Office
    business_value: Allow role-aware assistance without creating an alternate access path.
    specification:
      - PSD-PEP-150
      - PSD-PEP-120
    api:
      - docs/api/ai.yaml
    acceptance_criteria:
      - Every AI tool call uses the requesting user's verified organization and permissions.
      - Unauthorized tools and records are refused without disclosure.
      - AI remains disabled from direct unrestricted database access.
    security_impact: Critical
    compliance_impact: High
    implementation_status: Planned

  - id: PSD-REQ-DATA-000001
    title: Protected Data Encryption
    hierarchy: Platform
    status: Approved
    priority: Critical
    owner: Security Office
    business_value: Reduce exposure of confidential enterprise and workforce information.
    specification:
      - PSD-PEP-120
    acceptance_criteria:
      - Approved encryption protects data in transit, at rest, in backup, and in export.
      - Highly confidential fields receive additional protection where required.
      - Keys are separated from data and never committed to source.
    security_impact: Critical
    compliance_impact: Foundational
    implementation_status: Planned

  - id: PSD-REQ-HR-WORKER-000001
    title: Worker Management
    hierarchy: Module
    status: Approved
    priority: High
    owner: HR Domain
    business_value: Maintain complete, tenant-scoped workforce relationships and history.
    specification:
      - PSD-PEP-3010
      - PSD-PEP-110
    api:
      - docs/api/worker.yaml
    events:
      - docs/asyncapi/worker-events.yaml
    database_objects:
      - worker_assignments
    acceptance_criteria:
      - Authorized users can create and retrieve tenant-scoped worker assignments.
      - Historical assignments are preserved.
      - Directory views exclude highly confidential fields.
    security_impact: High
    compliance_impact: High
    implementation_status: Planned
