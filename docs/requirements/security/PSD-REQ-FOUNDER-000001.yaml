requirement_id: PSD-REQ-FOUNDER-000001
title: Final Active Founder Protection
status: Implemented
priority: Critical
specification: PSD-PEP-730
statement: >-
  PeopleSyncD shall prevent an organization from suspending, ending, or removing
  membership-management authority from its final active Founder.
acceptance_criteria:
  - Founder lockout is checked before membership mutation.
  - Another active Founder must retain organization.membership.manage authority.
  - A PostgreSQL trigger independently enforces the invariant.
  - A conflicting API request returns a controlled conflict response.
  - Denied mutation leaves the Founder membership and active sessions unchanged.
implementation:
  - apps/api/src/identity-contract.ts
  - apps/api/src/identity-memory.ts
  - apps/api/src/identity-postgres.ts
  - apps/api/src/server.ts
  - database/migrations/0005_phase7b2b_recovery_replay_founder.sql
tests:
  - apps/api/src/server.test.ts
  - apps/api/src/postgres.integration.test.ts
release_status: 0.4.1-internal-verified
