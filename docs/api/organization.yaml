openapi: 3.1.0
info: { title: PeopleSyncD Organization API, version: 0.1.0 }
security: [{ bearerAuth: [] }]
paths:
  /v1/organizations:
    get:
      operationId: listOrganizations
      responses:
        '200': { description: Organizations authorized for the authenticated user }
  /v1/organizations/{organizationId}:
    get:
      operationId: getOrganization
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Organization detail }
        '404': { description: Not found within authorized scope }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
