openapi: 3.1.0
info:
  title: PeopleSyncD API
  version: 0.2.0
  description: Identity and tenant-context vertical slice for the PeopleSyncD platform.
  license:
    name: PeopleSyncD Proprietary License
    url: https://github.com/deaconjason-stack/PeopleSyncD/blob/main/LICENSE
servers:
  - url: https://api.peoplesyncd.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get service readiness status
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /api/v1/auth/register-tenant:
    post:
      operationId: registerTenant
      summary: Register an owner account and tenant organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTenantRequest'
      responses:
        '201':
          description: Tenant and owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          description: Registration validation failed
        '409':
          description: Email or organization slug already exists
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a platform user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          description: Login request is invalid
        '401':
          description: Credentials are invalid
  /api/v1/auth/organizations:
    get:
      operationId: listMyOrganizations
      summary: List organizations available to the authenticated user
      responses:
        '200':
          description: Organization memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAccess'
        '401':
          description: Authentication required
  /api/v1/auth/select-organization:
    post:
      operationId: selectOrganization
      summary: Exchange a user token for a tenant-scoped token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
      responses:
        '200':
          description: Tenant-scoped token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          description: Tenant selection request is invalid
        '401':
          description: Authentication required
        '403':
          description: Active organization membership required
  /api/v1/auth/me:
    get:
      operationId: getCurrentSession
      summary: Get the current identity and tenant context
      responses:
        '200':
          description: Current validated session
        '401':
          description: Authentication required
  /api/v1/organizations/{id}:
    get:
      operationId: getOrganization
      summary: Get the selected tenant organization
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization found
        '401':
          description: Authentication required
        '403':
          description: Requested organization does not match the selected tenant
        '404':
          description: Organization not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterTenantRequest:
      type: object
      required:
        - organizationName
        - organizationSlug
        - displayName
        - email
        - password
      properties:
        organizationName:
          type: string
          maxLength: 200
        organizationSlug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        displayName:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SelectOrganizationRequest:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: string
          format: uuid
    OrganizationAccess:
      type: object
      required:
        - membershipId
        - organizationId
        - organizationName
        - organizationSlug
        - role
        - status
      properties:
        membershipId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        organizationSlug:
          type: string
        role:
          type: string
          enum: [Owner, Administrator, Manager, Member, Auditor]
        status:
          type: string
          enum: [Active, Suspended, Revoked]
    AccessToken:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          type: object
        tenant:
          type: [object, 'null']
