openapi: 3.1.0
info:
  title: PeopleSyncD API
  version: 0.1.0
  description: Starter contract for the M1.2.1 platform foundation.
  license:
    name: PeopleSyncD Proprietary License
    url: https://github.com/deaconjason-stack/PeopleSyncD/blob/main/LICENSE
servers:
  - url: https://api.peoplesyncd.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get service readiness status
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /api/v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization
      responses:
        '201':
          description: Organization created
        '400':
          description: Invalid organization request
        '401':
          description: Authentication required
        '403':
          description: Organization creation denied
        '409':
          description: Organization slug conflict
  /api/v1/organizations/{id}:
    get:
      operationId: getOrganization
      summary: Get an organization by identifier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization found
        '401':
          description: Authentication required
        '403':
          description: Organization read denied
        '404':
          description: Organization not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
