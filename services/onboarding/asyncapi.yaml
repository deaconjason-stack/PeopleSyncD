asyncapi: 2.6.0
info: { title: PeopleSyncD Onboarding Events, version: 0.1.0 }
channels:
  onboarding.task_completed.v1:
    publish:
      operationId: publishOnboardingTaskCompleted
      message:
        payload:
          type: object
          required: [eventId, organizationId, onboardingInstanceId, taskId, occurredAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            onboardingInstanceId: { type: string, format: uuid }
            taskId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
