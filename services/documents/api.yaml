openapi: 3.1.0
info:
  title: PeopleSyncD Documents Service API
  version: 0.1.0
  description: Secure document metadata, version, and delivery contract.
  license:
    name: Proprietary
servers:
  - url: https://api.peoplesyncd.example
security:
  - bearerAuth: []
paths:
  /v1/documents:
    post:
      operationId: createDocument
      summary: Create document metadata and an authorized upload request
      responses:
        '201': { description: Document metadata and upload authorization created }
        '400': { description: Invalid document request }
        '403': { description: Document creation denied }
    get:
      operationId: listDocuments
      summary: List authorized document metadata
      responses:
        '200': { description: Authorized document results }
        '403': { description: Document access denied }
  /v1/documents/{documentId}/delivery:
    post:
      operationId: authorizeDocumentDelivery
      summary: Create a short-lived authorized delivery reference
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Short-lived delivery authorization created }
        '403': { description: Access denied or recent authentication required }
        '404': { description: Document not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
