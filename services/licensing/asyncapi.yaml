asyncapi: 2.6.0
info:
  title: PeopleSyncD Licensing Events
  version: 0.1.0
channels:
  licensing.entitlements_changed.v1:
    publish:
      operationId: publishEntitlementsChanged
      message:
        payload:
          type: object
          required: [eventId, organizationId, licenseId, version, occurredAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            licenseId: { type: string, format: uuid }
            version: { type: string }
            occurredAt: { type: string, format: date-time }
  licensing.status_changed.v1:
    publish:
      operationId: publishLicenseStatusChanged
      message:
        payload:
          type: object
          required: [eventId, organizationId, licenseId, status, occurredAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            licenseId: { type: string, format: uuid }
            status: { type: string }
            occurredAt: { type: string, format: date-time }
