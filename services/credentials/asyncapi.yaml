asyncapi: 2.6.0
info: { title: PeopleSyncD Credential and Training Events, version: 0.1.0 }
channels:
  credential.expiring.v1:
    publish:
      operationId: publishCredentialExpiring
      message:
        payload:
          type: object
          required: [eventId, organizationId, credentialId, expiresAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            credentialId: { type: string, format: uuid }
            expiresAt: { type: string, format: date-time }
