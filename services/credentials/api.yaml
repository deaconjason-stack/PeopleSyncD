openapi: 3.1.0
info:
  title: PeopleSyncD Credentials and Training API
  version: 0.1.0
  description: Credential verification and training completion contract.
  license:
    name: PeopleSyncD Proprietary License
    url: https://github.com/deaconjason-stack/PeopleSyncD/blob/main/LICENSE
servers:
  - url: https://api.peoplesyncd.example
security:
  - bearerAuth: []
paths:
  /v1/credentials:
    post:
      operationId: createCredentialRecord
      summary: Create a worker credential record
      responses:
        '201': { description: Credential record created }
        '400': { description: Invalid credential request }
        '403': { description: Access denied }
  /v1/training/completions:
    post:
      operationId: recordTrainingCompletion
      summary: Record verified training completion
      responses:
        '201': { description: Completion recorded }
        '400': { description: Invalid completion evidence }
        '403': { description: Access denied }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
