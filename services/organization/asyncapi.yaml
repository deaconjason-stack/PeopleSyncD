asyncapi: 2.6.0
info:
  title: PeopleSyncD Organization Events
  version: 0.1.0
channels:
  organization.membership_changed.v1:
    publish:
      operationId: publishMembershipChanged
      message:
        payload:
          type: object
          required: [eventId, organizationId, userId, status, occurredAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            status: { type: string }
            occurredAt: { type: string, format: date-time }
  organization.hierarchy_changed.v1:
    publish:
      operationId: publishHierarchyChanged
      message:
        payload:
          type: object
          required: [eventId, organizationId, occurredAt]
          properties:
            eventId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
